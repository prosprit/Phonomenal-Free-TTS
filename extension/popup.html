<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phonomenal</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="head">
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>Phonomenal</h1>
  </header>
  <p class="how">Select text on a page, <b>right-click</b>, then choose <b>Read aloud</b>.</p>

  <fieldset>
    <legend>Voice</legend>
    <div class="vgrid">
      <div class="col" role="group" aria-labelledby="menH"><h3 id="menH">Men</h3><div id="men"></div></div>
      <div class="col" role="group" aria-labelledby="womenH"><h3 id="womenH">Women</h3><div id="women"></div></div>
    </div>
    <p class="vnote" id="vnote" aria-live="polite"></p>
  </fieldset>

  <fieldset>
    <legend>Speed</legend>
    <div class="speeds" id="speeds"></div>
  </fieldset>

  <div class="dock">
    <button class="btn primary wide" id="try" type="button">Hear this voice</button>
    <div class="now" id="now" hidden>
      <span id="nowLabel" aria-live="polite">Reading aloud</span>
      <button class="btn" id="pause" type="button">Pause</button>
      <button class="btn stop" id="stop" type="button">Stop</button>
    </div>
  </div>
  <p class="small" id="shortcut" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
