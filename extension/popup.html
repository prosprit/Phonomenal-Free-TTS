<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phonomenal</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="head">
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>Phonomenal</h1>
    <button class="quiet" id="openPdf" type="button">Open a PDF…</button>
  </header>

  <!-- One slot under the header: the update prompt, else the PDF prompt, else how to start reading. -->
  <section class="card" id="updateCard" hidden>
    <span>Phonomenal was updated.</span>
    <button class="btn primary" id="finishUpdate" type="button">Restart it</button>
  </section>
  <section class="card" id="pdfCard" hidden>
    <span>This tab is a PDF.</span>
    <button class="btn primary" id="readPdf" type="button">Read this PDF</button>
  </section>
  <p class="how" id="how">Select text, <b>right-click</b>, choose <b>Read aloud</b>.<span id="shortcut" hidden></span></p>

  <section class="grp" aria-labelledby="voiceH">
    <div class="ghead">
      <h2 id="voiceH">Voice</h2>
      <label class="check"><input type="checkbox" id="detect" aria-describedby="langNote"> Detect language</label>
    </div>
    <div class="seg" id="langs" role="radiogroup" aria-label="Voices for"></div>
    <p class="hint" id="langNote"></p>
    <div class="vgroup" role="group" aria-labelledby="menH"><h3 id="menH">Men</h3><div class="vgrid" id="men"></div></div>
    <div class="vgroup" role="group" aria-labelledby="womenH"><h3 id="womenH">Women</h3><div class="vgrid" id="women"></div></div>
    <p class="vnote" id="vnote"></p>
  </section>

  <div class="dock">
    <div class="seg" id="speeds" role="radiogroup" aria-label="Speed"></div>
    <button class="btn primary" id="try" type="button">Hear this voice</button>
    <div class="now" id="now" hidden>
      <button class="btn primary" id="pause" type="button">Pause</button>
      <button class="btn" id="stop" type="button">Stop</button>
    </div>
  </div>
  <p class="status" id="nowLabel" aria-live="polite"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
